[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omni_fetcher"
dynamic = ["version"]
description = "Universal data fetcher with Pydantic schemas"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Jainil"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "python-magic>=0.4.27",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "python-dateutil>=2.8.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    # New for extensions
    "yt-dlp>=2023.0.0",
    "feedparser>=6.0.0",
    "boto3>=1.28.0",
    "pypdf>=6.7.5",
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
omni-fetcher = "omni_fetcher.cli:main"
omni-fetcher-mcp = "omni_fetcher.mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    # Pinned to the 0.9 series: ruff's *default* lint ruleset (and formatter)
    # drifts across minor versions, and an unpinned `>=` silently pulled a newer
    # ruff that flags ~200 pre-existing findings repo-wide -- an infra failure,
    # not a code one. Pin so CI is deterministic; adopting a newer ruff + fixing
    # its findings is a separate, deliberate cleanup.
    "ruff>=0.9.0,<0.10.0",
    "mypy>=1.0",
    "types-PyYAML",
    "types-python-dateutil",
    "pre-commit>=3.0",
    "python-dotenv>=1.0.0",
]
office = [
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
]
web = [
    "trafilatura>=1.0.0",
    "readability-lxml>=0.8.0",
]
gdrive = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "PyJWT>=2.0.0",
    "cryptography>=41.0.0",
]
confluence = [
    "atlassian-python-api>=3.0.0",
]
slack = [
    "slack-sdk>=3.0.0",
]
jira = [
    "atlassian-python-api>=3.0.0",
]
kafka = [
    "aiokafka>=0.10",
]
websockets = [
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]
elasticsearch = [
    "elasticsearch>=8.0,<9.0",
]
postgres = [
    "asyncpg>=0.29",
]
mysql = [
    "aiomysql>=0.2",
]
gcs = [
    "google-cloud-storage>=2.10.0",
]
azure = [
    "azure-storage-blob>=12.19.0",
]
mcp = [
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
# Flat layout: without an explicit include, auto-discovery sweeps stray
# virtualenvs living under omni_fetcher/ into the wheel.
include = ["omni_fetcher*"]
exclude = ["omni_fetcher.venv*", "omni_fetcher.vevn*", "tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools_scm]
# Version is derived from the latest git tag (e.g. tag "v1.0.0" -> "1.0.0").
# Between tags, a dev version is produced. fallback_version is used when
# building outside a git checkout (e.g. from an sdist without .git).
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
# A stray local virtualenv under the package dir must never be checked.
exclude = ["venv"]
# The plugin teaches mypy pydantic's positional Field(default, ...) form;
# without it every such field looks required at call sites.
plugins = ["pydantic.mypy"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Optional/untyped third-party dependencies with no usable type stubs.
module = [
    "aiokafka",
    "aiokafka.*",
    "aiomysql",
    "aiomysql.*",
    "asyncpg",
    "asyncpg.*",
    "aiohttp",
    "aiohttp.*",
    "azure.*",
    "google.cloud.*",
    "google.oauth2.*",
    "websockets",
    "websockets.*",
    "elasticsearch",
    "elasticsearch.*",
    "atlassian.*",
    "boto3.*",
    "botocore.*",
    "docx.*",
    "feedparser.*",
    "google.*",
    "googleapiclient.*",
    "jwt.*",
    "magic.*",
    "pptx.*",
    "readability.*",
    "slack_sdk.*",
    "trafilatura.*",
    "yt_dlp.*",
]
ignore_missing_imports = true
