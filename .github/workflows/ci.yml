name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ``mcp`` is a typed dependency, so installing it lets mypy actually
          # check the MCP server against the SDK's stubs rather than treating
          # it as Any. Other optional connector deps stay uninstalled and are
          # handled by the ignore_missing_imports override in pyproject.
          pip install -e ".[dev,mcp]"

      - name: Run mypy
        run: mypy omni_fetcher/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every extra, deliberately. A connector gated behind a missing extra
      # short-circuits to UNSUPPORTED before the logic under test runs, so a
      # partial install does not "skip" those suites -- it fails them, and it
      # did so for twelve extras. Base-install behaviour is not this job's
      # concern: the dedicated smoke job below installs the bare wheel and
      # asserts the extras stay deferred.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,office,web,gdrive,confluence,slack,jira,kafka,websockets,elasticsearch,postgres,mysql,gcs,azure,duckdb,bigquery,redshift,pubsub,amqp,mongodb,mcp]"

      # Both integration trees are for local, opt-in runs and are excluded:
      #
      # - tests/integration hits live services (httpbin, wikipedia, YouTube,
      #   ...) and needs real credentials.
      # - tests/v1/integration drives Docker containers (Azurite, LocalStack,
      #   the BigQuery/PubSub emulators, ...) at hard-coded localhost ports.
      #   Those modules guard themselves with importorskip on the *driver*,
      #   which silently stopped protecting them once this job began installing
      #   every extra: the import then succeeds and the test blocks on a TCP
      #   connection to a container that does not exist, hanging the run until
      #   the job times out. The guard was never a statement about CI.
      - name: Run pytest
        run: |
          pytest --cov=omni_fetcher --cov-report=xml \
            --ignore=tests/integration \
            --ignore=tests/v1/integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  smoke:
    name: Base-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # A plain "pip install omni-fetcher": the wheel, no extras, not editable.
      # Every other job installs -e ".[dev,office,...]", which hides undeclared
      # runtime deps and import-time hard requirements on optional extras.
      - name: Install the wheel alone
        run: pip install dist/*.whl

      - name: Assert nothing stray was packaged
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          stray = [n for n in names if "/venv/" in n or "/vevn/" in n]
          assert not stray, f"stray files packaged into the wheel: {stray}"
          print(f"wheel clean: {len(names)} entries")
          PY

      # Runs from a temp dir on purpose: the checkout's ./omni_fetcher source
      # tree would shadow the installed package and void the whole test.
      - name: Smoke-test console script and public API
        run: |
          cd "$(mktemp -d)"
          printf '# Title\n\nHello world.\n' > sample.md
          omni-fetcher --help
          omni-fetcher version
          omni-fetcher v1 fetch sample.md
          python - <<'PY'
          import asyncio, warnings
          warnings.filterwarnings("ignore", category=DeprecationWarning, module="omni_fetcher")

          # The legacy entry point is documented in the README and must keep
          # working on a base install.
          from omni_fetcher import OmniFetcher  # noqa: F401

          # Fetchers behind optional extras must stay importable without them,
          # and defer their ImportError to fetch() time.
          from omni_fetcher.fetchers.docx import DOCXFetcher, DOCX_AVAILABLE
          from omni_fetcher.fetchers.pptx import PPTXFetcher, PPTX_AVAILABLE
          assert DOCX_AVAILABLE is False, "expected a base install without [office]"
          assert PPTX_AVAILABLE is False, "expected a base install without [office]"

          from omni_fetcher.v1 import Success
          from omni_fetcher.v1.connectors.local_file import LocalFileFetcher

          async def main():
              result = await LocalFileFetcher().fetch("sample.md")
              assert isinstance(result, Success), result

              for fetcher, ext in ((DOCXFetcher(), "docx"), (PPTXFetcher(), "pptx")):
                  try:
                      await fetcher.fetch(f"x.{ext}")
                  except ImportError as exc:
                      assert "omni_fetcher[office]" in str(exc), exc
                  else:
                      raise AssertionError(f"{ext}: expected ImportError without [office]")

          asyncio.run(main())
          print("base install OK: CLI, legacy API, v1 fetch, deferred extras")
          PY

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install package
        run: pip install -e ".[dev]"

      # Audits the installed environment (the resolved dependency tree of
      # ".[dev]"). --fail-on is not a pip-audit flag; it already exits
      # non-zero when vulnerabilities are found. The editable package
      # itself has a local dev version that is not on PyPI, so skip it.
      - name: Run pip-audit
        run: pip-audit --skip-editable
