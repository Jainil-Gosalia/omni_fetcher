name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build, test & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tags; it needs full
          # history + tags, not a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,office,web,gdrive,confluence,slack,jira,kafka]" build

      - name: Run tests (publish gate)
        # Unit/contract suite only. Integration tests require live
        # credentials/network and must not gate a release.
        run: pytest -q --ignore=tests/integration

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    # Pre-release GitHub Releases (e.g. 1.0.0rc1) and manual dispatch go to
    # TestPyPI so the artifact can be validated before a real publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == true)
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/omni-fetcher
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    # Only final (non-prerelease) GitHub Releases publish to real PyPI.
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omni-fetcher
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
